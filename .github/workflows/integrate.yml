name: javascript-CI

on:
  push:
    branches: [main, final-test]
  pull_request:
    branches: [main, master, final-test]

permissions: write-all

jobs:
  ci_to_main:
    runs-on: ubuntu-latest
    env:
      # Fake URLs: generating the Prisma types does not connect to the database
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - name: Set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma types
        run: npx prisma generate
        working-directory: backend
      - name: Check types
        run: npm run typecheck
      - name: Run Unit Tests
        run: npx jest --verbose --coverage
      - name: Build frontend
        run: npm run build
      - name: Jest coverage report
        uses: ArtiomTr/jest-coverage-report-action@v2.2.6
        id: coverage
        with:
          output: report-markdown, comment
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: ${{ steps.coverage.outputs.report }}
      #####
